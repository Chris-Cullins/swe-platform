---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: installations.swe.dev
spec:
  group: swe.dev
  names:
    kind: Installation
    listKind: InstallationList
    plural: installations
    singular: installation
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Installation is the stable, system-namespaced identity of one platform
          installation. Project namespace claims bind to its immutable UID.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              InstallationSpec preserves an omitted isolation selection only for staged
              migration of legacy installations. There is deliberately no default.
            properties:
              isolation:
                description: |-
                  Isolation is the sole installation-wide isolation selection. Installation
                  UID remains the tenancy identity regardless of this configuration.
                properties:
                  mode:
                    description: |-
                      InstallationIsolationMode is the administrator-selected installation-wide
                      isolation contract. It is configuration, not evidence that isolation is
                      active.
                    enum:
                    - UnrestrictedDevelopment
                    - RestrictedProductionCalicoV3_32_1
                    type: string
                  policyConfigMapName:
                    description: |-
                      PolicyConfigMapName references the existing immutable administrator-owned
                      egress policy ConfigMap contract.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  runtimeClass:
                    description: |-
                      InstallationRuntimeClassExpectation names the exact RuntimeClass contract
                      required by a restricted isolation selection.
                    properties:
                      handler:
                        description: Handler is the exact RuntimeClass handler expected
                          by the administrator.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - handler
                    - name
                    type: object
                  storageClass:
                    description: |-
                      InstallationStorageClassExpectation names the exact StorageClass contract
                      required by a restricted isolation selection.
                    properties:
                      csiDriver:
                        description: CSIDriver is the exact CSI provisioner expected
                          on the StorageClass.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - csiDriver
                    - name
                    type: object
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: development mode must omit restricted inputs; restricted
                    mode requires policyConfigMapName, runtimeClass, and storageClass
                  rule: 'self.mode == ''UnrestrictedDevelopment'' ? (!has(self.policyConfigMapName)
                    && !has(self.runtimeClass) && !has(self.storageClass)) : (has(self.policyConfigMapName)
                    && has(self.runtimeClass) && has(self.storageClass))'
            type: object
          status:
            description: |-
              InstallationStatus contains bounded non-secret observations reserved for the
              future installation isolation controller. This slice does not write status.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              isolationRevision:
                description: |-
                  IsolationRevision is SHA-256 over the versioned canonical selection and
                  exact resolved object identities.
                pattern: ^[a-f0-9]{64}$
                type: string
              isolationState:
                description: |-
                  InstallationIsolationState is bounded controller-owned vocabulary reserved
                  for the staged activation flow. No controller writes it yet.
                enum:
                - LegacyUnclassified
                - Fencing
                - Blocked
                - Active
                type: string
              observedIsolation:
                description: ObservedIsolation is the exact selection used for these
                  observations.
                properties:
                  mode:
                    description: |-
                      InstallationIsolationMode is the administrator-selected installation-wide
                      isolation contract. It is configuration, not evidence that isolation is
                      active.
                    enum:
                    - UnrestrictedDevelopment
                    - RestrictedProductionCalicoV3_32_1
                    type: string
                  policyConfigMapName:
                    description: |-
                      PolicyConfigMapName references the existing immutable administrator-owned
                      egress policy ConfigMap contract.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  runtimeClass:
                    description: |-
                      InstallationRuntimeClassExpectation names the exact RuntimeClass contract
                      required by a restricted isolation selection.
                    properties:
                      handler:
                        description: Handler is the exact RuntimeClass handler expected
                          by the administrator.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - handler
                    - name
                    type: object
                  storageClass:
                    description: |-
                      InstallationStorageClassExpectation names the exact StorageClass contract
                      required by a restricted isolation selection.
                    properties:
                      csiDriver:
                        description: CSIDriver is the exact CSI provisioner expected
                          on the StorageClass.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - csiDriver
                    - name
                    type: object
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: development mode must omit restricted inputs; restricted
                    mode requires policyConfigMapName, runtimeClass, and storageClass
                  rule: 'self.mode == ''UnrestrictedDevelopment'' ? (!has(self.policyConfigMapName)
                    && !has(self.runtimeClass) && !has(self.storageClass)) : (has(self.policyConfigMapName)
                    && has(self.runtimeClass) && has(self.storageClass))'
              policyConfigMap:
                description: |-
                  InstallationPolicyConfigMapIdentity records the exact immutable policy
                  ConfigMap incarnation and canonical content digest.
                properties:
                  contentSHA256:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - contentSHA256
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: ConfigMap UID must be 1-128 bytes
                  rule: size(self.uid) > 0 && size(self.uid) <= 128
              runtimeClass:
                description: |-
                  InstallationRuntimeClassIdentity records an exact non-secret RuntimeClass
                  incarnation and observed handler.
                properties:
                  handler:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - handler
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: object UID must be 1-128 bytes
                  rule: size(self.uid) > 0 && size(self.uid) <= 128
              storageClass:
                description: |-
                  InstallationStorageClassIdentity records an exact non-secret StorageClass
                  incarnation and observed CSI driver.
                properties:
                  csiDriver:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - csiDriver
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: object UID must be 1-128 bytes
                  rule: size(self.uid) > 0 && size(self.uid) <= 128
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
