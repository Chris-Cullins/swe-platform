# Production baseline for GKE clusters whose environment node pools have GKE
# Sandbox enabled. Images inherit the chart appVersion as one coordinated
# release. The gvisor RuntimeClass must exist before environments run.
# Restricted activation is unsupported; omission preserves LegacyUnclassified.
installation:
  isolation:
    mode: ""

tenancy:
  mode: scoped

replicaCount: 2

controlPlane:
  metrics:
    port: 8082
  portal:
    enabled: false
  sessions:
    backend: postgres
    keyringSecret:
      # Create this administrator-owned Secret out of band.
      name: swe-platform-session-keyring
      key: keyring.json
  transcripts:
    postgresSecret:
      # Create this Secret out of band before installing the production preset.
      name: swe-platform-postgres

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: swe-platform

environmentTemplates:
  - name: medium
    spec:
      size: medium
      runtimeClass: gvisor
      idleTimeout: 15m
      diskSize: 40Gi
