replicaCount: 1

image:
  repository: ghcr.io/chris-cullins/swe-platform/operator
  # Defaults to Chart.appVersion so released charts select their coordinated release.
  tag: ""
  # When set, takes precedence over tag and pins the exact published manifest.
  digest: ""
  pullPolicy: IfNotPresent

operator:
  metrics:
    # Exposed on the internal operator metrics Service.
    port: 8080
  health:
    # Used only for the operator pod's health and readiness probes.
    port: 8081

controlPlane:
  enabled: true
  replicaCount: 1
  metrics:
    # Exposed on the internal control-plane Service as a dedicated listener.
    port: 8082
  portal:
    # Portal routing is disabled unless explicitly enabled. Suffix is the
    # canonical wildcard DNS suffix without a leading "*." or trailing dot.
    enabled: false
    suffix: ""
    scheme: https
    ingress:
      # This Ingress owns only *.suffix; expose the ordinary API separately.
      enabled: false
      ingressClassName: ""
      annotations: {}
      tls:
        # Administrator-owned wildcard certificate Secret; never created here.
        secretName: ""
  sessions:
    # memory is development-only. Production presets explicitly select postgres.
    backend: memory
    # Administrator-owned Secret mounted only when backend is postgres. The chart
    # references but never creates or manages this Secret.
    keyringSecret:
      name: ""
      key: keyring.json
  image:
    repository: ghcr.io/chris-cullins/swe-platform/control-plane
    # Defaults to Chart.appVersion.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    tokenAudience: swe-platform
    # Honor X-Forwarded-Host/Proto for WebSocket origin checks only when a trusted
    # reverse proxy overwrites both headers.
    trustProxyHeaders: false
    # Development-only escape hatch for direct HTTP access. Production browser
    # sessions require HTTPS and always set Secure cookies.
    allowInsecureSessions: false
    # Optional all-access bootstrap credential for initial self-hosted setup.
    # Create this Secret out of band and disable/remove it after configuring RBAC.
    bootstrapTokenSecret:
      name: ""
      key: token
  transcripts:
    # Production must reference an out-of-band Secret containing a PostgreSQL URL.
    # Empty retains the development-only process-local store.
    postgresSecret:
      name: ""
      key: url
    maxEventsPerRun: 10000
    maxBytesPerRun: 67108864
    maxReplayEvents: 1000
    maxSubscribers: 1024
    subscriberBuffer: 64
    pollInterval: 500ms
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

leaderElection: true

# Tenancy mode is intentionally required. Scoped mode watches only the exact
# claimed Project namespaces listed here. Adding or removing a namespace is a
# controlled Helm upgrade/operator restart operation. trusted-admin restores
# deliberate cluster-wide authority and must not be selected accidentally.
tenancy:
  mode: ""
  namespaces: []

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Default image for EnvironmentTemplate entries that omit spec.image. Its tag
# defaults to Chart.appVersion alongside the operator and control plane.
environmentImage:
  repository: ghcr.io/chris-cullins/swe-platform/env-base
  tag: ""
  digest: ""

# Inert EnvironmentTemplate catalog sources created in the system/release
# namespace. `swe project onboard` copies selected sources into a claimed
# Project namespace; these source objects can never provision Environments.
environmentTemplates: []
