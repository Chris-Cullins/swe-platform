image:
  repository: ghcr.io/chris-cullins/swe-platform/operator
  tag: dev
  pullPolicy: IfNotPresent

controlPlane:
  metrics:
    port: 8082
  portal:
    enabled: false
  # Development sessions are intentionally process-local.
  sessions:
    backend: memory
  image:
    tag: dev
  auth:
    allowInsecureSessions: true
  # Keep CPU headroom for the claimed environment and its immediate warm-pool
  # replacement on kind's single control-plane node.
  resources:
    requests:
      cpu: 10m

leaderElection: false

# Explicit non-production selection; this contract is inert in this release.
installation:
  isolation:
    mode: UnrestrictedDevelopment

# Deliberate local-development authority. The primary e2e overrides this to
# scoped and onboards a distinct Project namespace.
tenancy:
  mode: trusted-admin

environmentTemplates:
  - name: small
    spec:
      image: ghcr.io/chris-cullins/swe-platform/env-base:dev
      # Leave room for the claimed environment and its immediate pool replacement
      # on kind's single control-plane node.
      size: tiny
      idleTimeout: 15m
      diskSize: 5Gi
      warmPool:
        min: 1
