{{- $mode := include "swe-platform.tenancyMode" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swe-platform.clusterFullname" . }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["swe.dev"]
    resources: ["environments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["swe.dev"]
    resources: ["runs"]
    verbs: ["get", "list", "patch", "update", "watch"]
  {{- if .Values.controlPlane.enabled }}
  - apiGroups: ["swe.dev"]
    resources: ["runs/transcript"]
    verbs: ["update"]
  {{- end }}
  - apiGroups: ["swe.dev"]
    resources: ["environments/status", "environmenttemplates/status", "runs/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["swe.dev"]
    resources: ["environmenttemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["swe.dev"]
    resources: ["agentcredentialprofiles", "projects"]
    verbs: ["get", "list", "watch"]
  # Repository services discover exact gateway-owned route authority. When
  # portals are disabled this returns a durable denial revision.
  - apiGroups: ["swe.dev"]
    resources: ["environments/portal", "environmentservices/portal"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swe-platform.clusterFullname" . }}-scope
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swe-platform.clusterFullname" . }}-scope
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swe-platform.clusterFullname" . }}-scope
subjects:
  - kind: ServiceAccount
    name: {{ include "swe-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "swe-platform.fullname" . }}-system
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["swe.dev"]
    resources: ["installations"]
    verbs: ["get"]
  - apiGroups: ["swe.dev"]
    resources: ["environmenttemplates"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "swe-platform.fullname" . }}-system
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "swe-platform.fullname" . }}-system
subjects:
  - kind: ServiceAccount
    name: {{ include "swe-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if eq $mode "trusted-admin" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swe-platform.clusterFullname" . }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swe-platform.clusterFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "swe-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.controlPlane.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swe-platform.controlPlaneFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swe-platform.controlPlaneClusterFullname" . }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  {{- if .Values.controlPlane.portal.enabled }}
  # The enabled gateway resolves only the exact credential Secret named by the
  # current Environment pod. It cannot list or watch Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: ["swe.dev"]
    resources: ["projects"]
    verbs: ["get", "list"]
  - apiGroups: ["swe.dev"]
    resources: ["environments"]
    verbs:
      - "get"
      - "patch"
      {{- if .Values.controlPlane.portal.enabled }}
      - "list"
      {{- end }}
  {{- if .Values.controlPlane.portal.enabled }}
  # The gateway is the sole owner of status.portalRoutes and
  # status.nextPortalRouteGeneration. Keep status authority absent when the
  # portal is disabled rather than granting it to every control-plane install.
  - apiGroups: ["swe.dev"]
    resources: ["environments/status"]
    verbs: ["update"]
  {{- end }}
  - apiGroups: ["swe.dev"]
    resources: ["environmenttemplates"]
    verbs: ["get"]
  - apiGroups: ["swe.dev"]
    resources: ["runs"]
    verbs: ["create", "get", "list", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swe-platform.controlPlaneClusterFullname" . }}-scope
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swe-platform.controlPlaneClusterFullname" . }}-scope
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swe-platform.controlPlaneClusterFullname" . }}-scope
subjects:
  - kind: ServiceAccount
    name: {{ include "swe-platform.controlPlaneFullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "swe-platform.controlPlaneFullname" . }}-system
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: ["swe.dev"]
    resources: ["installations"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "swe-platform.controlPlaneFullname" . }}-system
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "swe-platform.controlPlaneFullname" . }}-system
subjects:
  - kind: ServiceAccount
    name: {{ include "swe-platform.controlPlaneFullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if eq $mode "trusted-admin" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swe-platform.controlPlaneClusterFullname" . }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swe-platform.controlPlaneClusterFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "swe-platform.controlPlaneFullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
