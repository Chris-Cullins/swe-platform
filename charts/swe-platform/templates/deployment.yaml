apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swe-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Prevent old flat-status and new nested-status controller versions from
  # writing Environment recovery state concurrently during this transition.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "swe-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "swe-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: operator
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "swe-platform.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:{{ int .Values.operator.metrics.port }}
            - --health-probe-bind-address=:{{ int .Values.operator.health.port }}
            - --leader-elect={{ .Values.leaderElection }}
            - --control-plane-namespace=$(POD_NAMESPACE)
            - --control-plane-name={{ include "swe-platform.name" . }}
            - --control-plane-instance={{ .Release.Name }}
            - --tenancy-mode={{ include "swe-platform.tenancyMode" . }}
            - --installation-namespace=$(POD_NAMESPACE)
            - --installation-name={{ include "swe-platform.fullname" . }}
            {{- range .Values.tenancy.namespaces }}
            - --tenancy-namespace={{ . }}
            {{- end }}
            {{- if .Values.controlPlane.enabled }}
            - --transcript-url=http://{{ include "swe-platform.controlPlaneFullname" . }}
            - --transcript-token-file=/var/run/secrets/swe-platform/transcript-token
            {{- end }}
            {{- if .Values.operator.githubApp.enabled }}
            - --github-app-client-id={{ required "operator.githubApp.clientID is required" .Values.operator.githubApp.clientID }}
            - --github-app-private-key-file=/var/run/secrets/swe-platform-github-app/private-key.pem
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ int .Values.operator.metrics.port }}
            - name: health
              containerPort: {{ int .Values.operator.health.port }}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.controlPlane.enabled .Values.operator.githubApp.enabled }}
          volumeMounts:
            {{- if .Values.controlPlane.enabled }}
            - name: transcript-token
              mountPath: /var/run/secrets/swe-platform
              readOnly: true
            {{- end }}
            {{- if .Values.operator.githubApp.enabled }}
            - name: github-app
              mountPath: /var/run/secrets/swe-platform-github-app
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.controlPlane.enabled .Values.operator.githubApp.enabled }}
      volumes:
        {{- if .Values.controlPlane.enabled }}
        - name: transcript-token
          projected:
            sources:
              - serviceAccountToken:
                  path: transcript-token
                  audience: {{ .Values.controlPlane.auth.tokenAudience | quote }}
                  expirationSeconds: 3600
        {{- end }}
        {{- if .Values.operator.githubApp.enabled }}
        - name: github-app
          secret:
            secretName: {{ required "operator.githubApp.secretName is required" .Values.operator.githubApp.secretName }}
            items:
              - key: {{ .Values.operator.githubApp.privateKeyKey }}
                path: private-key.pem
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
