    - expression: object.?status.?imageID == oldObject.?status.?imageID
      message: the portal gateway may not change status.imageID
    - expression: object.?status.?lastActiveAt == oldObject.?status.?lastActiveAt
      message: the portal gateway may not change status.lastActiveAt
    - expression: object.?status.?recovery == oldObject.?status.?recovery
      message: the portal gateway may not change status.recovery
