{{- if .Values.controlPlane.enabled }}
{{- if ne (int .Values.controlPlane.replicaCount) 1 }}
{{- fail "controlPlane.replicaCount must remain 1 until full control-plane HA is supported" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swe-platform.controlPlaneFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "swe-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "swe-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: {{ include "swe-platform.controlPlaneFullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}{{ if .Values.controlPlane.image.digest }}@{{ .Values.controlPlane.image.digest }}{{ else }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          args:
            - --listen-address=:8080
            - --metrics-bind-address=:{{ int .Values.controlPlane.metrics.port }}
          env:
            - name: SWE_TOKEN_AUDIENCE
              value: {{ .Values.controlPlane.auth.tokenAudience | quote }}
            - name: SWE_TRUST_PROXY_HEADERS
              value: {{ .Values.controlPlane.auth.trustProxyHeaders | quote }}
            - name: SWE_ALLOW_INSECURE_SESSIONS
              value: {{ .Values.controlPlane.auth.allowInsecureSessions | quote }}
            - name: SWE_PORTAL_SUFFIX
              value: {{ ternary .Values.controlPlane.portal.suffix "" .Values.controlPlane.portal.enabled | quote }}
            - name: SWE_PORTAL_SCHEME
              value: {{ ternary .Values.controlPlane.portal.scheme "" .Values.controlPlane.portal.enabled | quote }}
            - name: SWE_SESSION_BACKEND
              value: {{ .Values.controlPlane.sessions.backend | quote }}
            {{- if eq .Values.controlPlane.sessions.backend "postgres" }}
            - name: SWE_SESSION_KEYRING_FILE
              value: /var/run/secrets/swe-platform/session-keyring/keyring.json
            {{- end }}
            - name: SWE_TENANCY_MODE
              value: {{ include "swe-platform.tenancyMode" . | quote }}
            - name: SWE_INSTALLATION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SWE_INSTALLATION_NAME
              value: {{ include "swe-platform.fullname" . | quote }}
            - name: SWE_TENANCY_NAMESPACES
              value: {{ join "," .Values.tenancy.namespaces | quote }}
            {{- with .Values.controlPlane.auth.bootstrapTokenSecret.name }}
            - name: SWE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.controlPlane.auth.bootstrapTokenSecret.key | quote }}
            {{- end }}
            {{- with .Values.controlPlane.transcripts.postgresSecret.name }}
            - name: SWE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.controlPlane.transcripts.postgresSecret.key | quote }}
            {{- end }}
            - name: SWE_TRANSCRIPT_MAX_EVENTS_PER_RUN
              value: {{ int .Values.controlPlane.transcripts.maxEventsPerRun | quote }}
            - name: SWE_TRANSCRIPT_MAX_BYTES_PER_RUN
              value: {{ int .Values.controlPlane.transcripts.maxBytesPerRun | quote }}
            - name: SWE_TRANSCRIPT_MAX_REPLAY_EVENTS
              value: {{ int .Values.controlPlane.transcripts.maxReplayEvents | quote }}
            - name: SWE_TRANSCRIPT_MAX_SUBSCRIBERS
              value: {{ int .Values.controlPlane.transcripts.maxSubscribers | quote }}
            - name: SWE_TRANSCRIPT_SUBSCRIBER_BUFFER
              value: {{ int .Values.controlPlane.transcripts.subscriberBuffer | quote }}
            - name: SWE_TRANSCRIPT_POLL_INTERVAL
              value: {{ .Values.controlPlane.transcripts.pollInterval | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ int .Values.controlPlane.metrics.port }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          {{- if eq .Values.controlPlane.sessions.backend "postgres" }}
          volumeMounts:
            - name: session-keyring
              mountPath: /var/run/secrets/swe-platform/session-keyring
              readOnly: true
          {{- end }}
      {{- if eq .Values.controlPlane.sessions.backend "postgres" }}
      volumes:
        - name: session-keyring
          secret:
            secretName: {{ .Values.controlPlane.sessions.keyringSecret.name | quote }}
            items:
              - key: {{ .Values.controlPlane.sessions.keyringSecret.key | quote }}
                path: keyring.json
      {{- end }}
{{- end }}
